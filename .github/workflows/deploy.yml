name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: symulator/package-lock.json

      - run: npm ci

      # base dla Vite wyznaczany jest z GITHUB_REPOSITORY (vite.config.ts) => /<nazwa-repo>/
      - run: npm run build

      # SPA fallback dla odświeżenia strony pod nieistniejącą ścieżką
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: symulator/dist

  deploy:
    # publikacja tylko z gałęzi głównej; na pozostałych gałęziach sprawdzamy samo budowanie
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
